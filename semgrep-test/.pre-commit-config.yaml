repos:
  - repo: local
    hooks:
      - id: bandit
        name: Bandit
        entry: bandit -r . -ll
        language: system
        pass_filenames: false
        types: [python]

      - id: semgrep
        name: Semgrep
        entry: semgrep --config security.yml
        language: system
        pass_filenames: false
        types: [python]

      - id: gitleaks
        name: Gitleaks
        entry: docker run --rm -v .:/repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact
        language: system
        pass_filenames: false
        stages: [pre-commit]
